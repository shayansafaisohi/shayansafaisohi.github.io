<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=block" rel="stylesheet">
<style>
@font-face { font-family: 'Estedad'; src: url('https://cdn.jsdelivr.net/gh/aminabedi68/Estedad@8.5/fonts/Estedad%5Bwght%5D.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; background: #05070d; }
body { font-family: 'Space Grotesk', 'Estedad', sans-serif; color: #e7ecf3; -webkit-font-smoothing: antialiased; }
.mono { font-family: 'JetBrains Mono', monospace; }
.fa { direction: rtl; font-family: 'Estedad', sans-serif; }
#stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #05070d; }
.blob { position: absolute; border-radius: 50%; filter: blur(110px); mix-blend-mode: screen; }
#grid { position: absolute; inset: -64px; background-image: linear-gradient(rgba(148,163,184,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,.07) 1px, transparent 1px); background-size: 64px 64px; -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 45%, #000 20%, transparent 75%); }
#stars { position: absolute; inset: 0; }

.scene { position: absolute; left: 140px; top: 44px; width: 1000px; height: 552px; transform-origin: 50% 50%; }
.win { position: absolute; inset: 0; border-radius: 18px; background: linear-gradient(180deg, #0e1527, #0a0f1c); border: 1px solid rgba(255,255,255,.1); overflow: hidden;
  box-shadow: 0 50px 120px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.03), 0 0 80px -20px var(--glow, rgba(34,211,238,.25)); }
.bar { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,.06); background: rgba(255,255,255,.025); }
.bar i { width: 11px; height: 11px; border-radius: 50%; display: block; }
.url { position: absolute; left: 50%; transform: translateX(-50%); font: 12px 'JetBrains Mono'; color: #94a3b8; background: rgba(255,255,255,.05); padding: 5px 16px; border-radius: 8px; min-width: 340px; text-align: center; }
.url b { color: #67e8f9; font-weight: 400; }
.content { position: absolute; top: 40px; left: 0; right: 0; bottom: 0; }
.abs { position: absolute; }

/* n8n scene */
.dots { background-image: radial-gradient(rgba(148,163,184,.22) 1px, transparent 1.2px); background-size: 22px 22px; }
.node { position: absolute; width: 150px; height: 66px; border-radius: 13px; background: #141b2d; border: 1.5px solid rgba(255,255,255,.12); display: flex; align-items: center; gap: 10px; padding: 0 12px; }
.node .ic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; font: 700 12px 'JetBrains Mono'; color: #0b1020; flex-shrink: 0; }
.node .t { font-size: 13px; font-weight: 700; color: #f1f5f9; }
.node .s { font: 10.5px 'JetBrains Mono'; color: #94a3b8; margin-top: 2px; white-space: nowrap; }
.node .ok { position: absolute; top: -9px; right: -9px; width: 20px; height: 20px; border-radius: 50%; background: #22c55e; color: #fff; font-size: 12px; display: grid; place-items: center; font-weight: 700; box-shadow: 0 0 12px rgba(34,197,94,.7); }
.node .cnt { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font: 10px 'JetBrains Mono'; color: #86efac; white-space: nowrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 9px; font-weight: 700; font-size: 13px; padding: 8px 14px; }

/* generic panel bits */
.card { background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 3px 9px; border-radius: 999px; }
.av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #0b1020; border: 2px solid #0e1527; }

/* caption */
.cap { position: absolute; left: 140px; top: 612px; width: 760px; }
.cap .num { font: 600 12px 'JetBrains Mono'; color: #67e8f9; letter-spacing: .18em; }
.cap .title { font: 700 30px 'Space Grotesk'; color: #fff; margin-top: 2px; white-space: nowrap; letter-spacing: -0.02em; }
.cap .title span { display: inline-block; white-space: pre; }
.cap .sub { font: 14px 'JetBrains Mono'; color: #94a3b8; margin-top: 4px; white-space: nowrap; }
#dots { position: absolute !important; right: 140px; top: 648px; display: flex; gap: 8px; }
#dots div { width: 22px; height: 5px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
#dots div b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #22d3ee, #a78bfa); }
#brand { position: absolute !important; right: 140px; top: 616px; font: 600 12px 'JetBrains Mono'; color: #64748b; letter-spacing: .12em; }
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
#caps, #dots, #brand { position: relative; z-index: 10; }
</style>
</head>
<body>
<div id="stage">
  <div id="bgwrap">
    <div class="blob" id="b1" style="width:620px;height:620px;background:#0891b2"></div>
    <div class="blob" id="b2" style="width:540px;height:540px;background:#7c3aed"></div>
    <div class="blob" id="b3" style="width:480px;height:480px;background:#2563eb"></div>
    <div class="blob" id="b4" style="width:300px;height:300px;background:#db2777"></div>
    <div id="grid"></div>
    <canvas id="stars" width="1280" height="720"></canvas>
  </div>
  <div id="scenes"></div>
  <div id="caps"></div>
  <div id="brand">SHAYAN SAFAI SOHI</div>
  <div id="dots"></div>
  <canvas id="fx" width="1280" height="720"></canvas>
</div>

<script>
const W = 1280, H = 720;
const D = 6;            // seconds per project
const N = 5;            // number of projects
const TOTAL = D * N;    // loop length
const TD = 1.0;         // transition duration
const SCENE_X = 140, SCENE_Y = 44, CONTENT_Y = SCENE_Y + 40;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const lerp = (a, b, p) => a + (b - a) * p;
const eIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eOut = p => 1 - Math.pow(1 - p, 3);
const eOut5 = p => 1 - Math.pow(1 - p, 5);
const eBack = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const TAU = Math.PI * 2;

function win(url, glow, inner) {
  return `<div class="win" style="--glow:${glow}"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><div class="url">${url}</div></div><div class="content">${inner}</div></div>`;
}

/* ===================== SCENE 0 · n8n AI workflow ===================== */
const NODES = [
  { id: 'n1', x: 30,  y: 215, ic: 'WH', c: '#fb923c', t: 'Webhook',   s: 'POST /invoice' },
  { id: 'n2', x: 230, y: 125, ic: 'AI', c: '#c084fc', t: 'AI Agent',  s: 'LLM · classify' },
  { id: 'n3', x: 230, y: 305, ic: 'Py', c: '#facc15', t: 'Code',      s: 'Python · extract' },
  { id: 'n4', x: 430, y: 215, ic: 'IF', c: '#4ade80', t: 'IF',        s: 'amount > 50M' },
  { id: 'n5', x: 630, y: 125, ic: 'PG', c: '#60a5fa', t: 'Postgres',  s: 'insert row' },
  { id: 'n6', x: 630, y: 305, ic: 'TG', c: '#38bdf8', t: 'Telegram',  s: 'notify manager' },
  { id: 'n7', x: 822, y: 215, ic: 'UI', c: '#22d3ee', t: 'Admin Panel', s: 'live dashboard' },
];
const RUN = { n1: [0.95, 1.1], n2: [1.6, 2.05], n3: [1.6, 2.1], n4: [2.5, 2.75], n5: [3.15, 3.45], n6: [3.15, 3.5], n7: [3.9, 4.15] };
const EDGES = [['n1','n2',1.1,1.6],['n1','n3',1.1,1.6],['n2','n4',2.1,2.5],['n3','n4',2.1,2.5],['n4','n5',2.75,3.15],['n4','n6',2.75,3.15],['n5','n7',3.5,3.9],['n6','n7',3.5,3.9]];
function scene0() {
  const nodeById = Object.fromEntries(NODES.map(n => [n.id, n]));
  const paths = EDGES.map(([a, b], i) => {
    const A = nodeById[a], B = nodeById[b];
    const x1 = A.x + 150, y1 = A.y + 33, x2 = B.x, y2 = B.y + 33;
    const d = `M${x1} ${y1} C${x1 + 55} ${y1}, ${x2 - 55} ${y2}, ${x2} ${y2}`;
    return `<path d="${d}" stroke="rgba(148,163,184,.3)" stroke-width="2" fill="none"/><path id="e${i}" d="${d}" stroke="url(#eg)" stroke-width="2.5" fill="none" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>`;
  }).join('');
  const nodes = NODES.map(n => `<div class="node" id="${n.id}" style="left:${n.x}px;top:${n.y}px"><div class="ic" style="background:${n.c}">${n.ic}</div><div><div class="t">${n.t}</div><div class="s">${n.s}</div></div><div class="ok">✓</div><div class="cnt">1 item</div></div>`).join('');
  const packets = EDGES.map((e, i) => `<div class="abs" id="pk${i}" style="width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(103,232,249,.9)"></div>`).join('');
  return win('n8n.local/workflow/<b>invoice-ai-triage</b>', 'rgba(255,109,90,.28)', `
    <div class="abs dots" style="inset:0"></div>
    <div class="abs" style="left:18px;top:14px;right:18px;height:36px;display:flex;align-items:center;gap:12px">
      <div style="font-weight:700;font-size:15px">Invoice intake → AI triage</div>
      <div class="pill mono" style="background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.3)">● Active</div>
      <div style="flex:1"></div>
      <div class="pill mono" style="color:#94a3b8">Last run · <span id="s0-last">2m ago</span></div>
      <div class="btn" id="s0-exec" style="background:#ff6d5a;color:#fff;box-shadow:0 8px 24px -8px rgba(255,109,90,.8)"><span id="s0-exec-t">▶ Execute workflow</span></div>
    </div>
    <svg class="abs" style="left:0;top:0" width="1000" height="512"><defs><linearGradient id="eg" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>${paths}</svg>
    ${nodes}${packets}
    <div class="abs" id="s0-toast" style="left:50%;bottom:22px;transform:translateX(-50%);background:#0f1a2e;border:1px solid rgba(34,197,94,.45);border-radius:12px;padding:10px 16px;display:flex;gap:10px;align-items:center;font-size:13px;box-shadow:0 20px 40px -10px rgba(0,0,0,.7)">
      <span style="width:22px;height:22px;border-radius:50%;background:#22c55e;display:grid;place-items:center;font-weight:700">✓</span>
      <span>Workflow executed successfully</span><span class="mono" style="color:#94a3b8">7 nodes · 1.9s</span>
    </div>`);
}
function update0(L, root) {
  const exec = root.querySelector('#s0-exec');
  const press = L > 0.9 && L < 1.05 ? 0.93 : 1;
  exec.style.transform = `scale(${press})`;
  root.querySelector('#s0-exec-t').textContent = (L > 0.9 && L < 4.2) ? '◌ Running…' : '▶ Execute workflow';
  root.querySelector('#s0-last').textContent = L > 4.2 ? 'just now' : '2m ago';
  NODES.forEach(n => {
    const el = root.querySelector('#' + n.id);
    const [a, b] = RUN[n.id];
    const running = L >= a && L < b, done = L >= b;
    const pulse = running ? 0.5 + 0.5 * Math.sin(L * 30) : 0;
    el.style.borderColor = running ? n.c : done ? 'rgba(74,222,128,.7)' : 'rgba(255,255,255,.12)';
    el.style.boxShadow = running ? `0 0 ${18 + 14 * pulse}px ${n.c}` : done ? '0 0 16px -4px rgba(74,222,128,.6)' : 'none';
    const okp = eBack(prog(L, b, b + 0.25));
    const ok = el.querySelector('.ok');
    ok.style.transform = `scale(${okp})`;
    el.querySelector('.cnt').style.opacity = prog(L, b, b + 0.3);
    el.style.transform = running ? `translateY(${-2 * pulse}px)` : 'none';
  });
  EDGES.forEach(([a, b, s, e], i) => {
    const p = eIO(prog(L, s, e));
    const path = root.querySelector('#e' + i);
    path.setAttribute('stroke-dashoffset', String(1 - p));
    const pk = root.querySelector('#pk' + i);
    if (p > 0 && p < 1) {
      const len = path.getTotalLength();
      const pt = path.getPointAtLength(len * p);
      pk.style.left = pt.x + 'px'; pk.style.top = pt.y + 'px'; pk.style.opacity = 1;
    } else pk.style.opacity = 0;
  });
  const tp = eOut(prog(L, 4.25, 4.6));
  const toast = root.querySelector('#s0-toast');
  toast.style.opacity = tp;
  toast.style.transform = `translateX(-50%) translateY(${(1 - tp) * 24}px) scale(${0.95 + 0.05 * tp})`;
}

/* ===================== SCENE 1 · HamNeshin ===================== */
const SPK = [
  { n: 'سارا', c: '#22d3ee', bg: 'linear-gradient(135deg,#0e3a4a,#0b1a2e)' },
  { n: 'امیر', c: '#a78bfa', bg: 'linear-gradient(135deg,#2e1a4a,#0b1428)' },
  { n: 'نگار', c: '#f472b6', bg: 'linear-gradient(135deg,#4a1a36,#120f22)' },
  { n: 'رضا', c: '#4ade80', bg: 'linear-gradient(135deg,#123a26,#0b1722)' },
];
const LINES = [
  [0, 'بودجه کمپین پاییز رو امروز نهایی کنیم.', 0.35],
  [1, 'گزارش فروش تا پنجشنبه آماده می‌شه.', 1.05],
  [2, 'طراحی صفحه فرود جدید با من.', 1.75],
  [3, 'جلسه بعدی شنبه ساعت ۱۰ صبح.', 2.45],
];
const ACTIONS = ['نهایی‌سازی بودجه کمپین — سارا', 'گزارش فروش تا پنجشنبه — امیر', 'طراحی صفحه فرود — نگار'];
function scene1() {
  const tiles = SPK.map((s, i) => {
    const x = 396 + (i % 2) * 301, y = 16 + Math.floor(i / 2) * 192;
    return `<div class="abs" id="t${i}" style="left:${x}px;top:${y}px;width:285px;height:176px;border-radius:14px;background:${s.bg};border:1px solid rgba(255,255,255,.08);overflow:hidden">
      <div class="abs fa" style="left:50%;top:44%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;background:${s.c};color:#0b1020;display:grid;place-items:center;font-size:26px;font-weight:800">${s.n[0]}</div>
      <div class="abs fa pill" style="right:10px;bottom:10px;background:rgba(0,0,0,.45);color:#e2e8f0;font-size:12px">${s.n}</div>
      <div class="abs ring" style="inset:0;border-radius:14px;border:2.5px solid ${s.c};opacity:0"></div>
    </div>`;
  }).join('');
  const bars = Array.from({ length: 58 }, (_, i) => `<div class="wb" style="width:5px;border-radius:3px;background:linear-gradient(#67e8f9,#818cf8)"></div>`).join('');
  const lines = LINES.map(([s, txt], i) => `<div class="line fa" id="l${i}" style="display:flex;gap:10px;align-items:flex-start;margin-bottom:14px">
      <div style="width:8px;height:8px;border-radius:50%;background:${SPK[s].c};margin-top:8px;flex-shrink:0"></div>
      <div style="font-size:13.5px;line-height:1.7"><b style="color:${SPK[s].c}">${SPK[s].n}</b><br><span class="tx" data-full="${txt}"></span></div></div>`).join('');
  const acts = ACTIONS.map((a, i) => `<div class="fa act" style="display:flex;gap:10px;align-items:center;padding:8px 0;font-size:13px;border-top:1px solid rgba(255,255,255,.06)"><div class="cb" style="width:18px;height:18px;border-radius:5px;border:1.5px solid #64748b;display:grid;place-items:center;font-size:11px;font-weight:800;color:#0b1020"></div><span>${a}</span></div>`).join('');
  return win('hamneshin.app/meeting/<b>live</b>', 'rgba(34,211,238,.28)', `
    ${tiles}
    <div class="abs" id="wave" style="left:396px;top:404px;width:586px;height:44px;display:flex;align-items:center;justify-content:space-between">${bars}</div>
    <div class="abs fa" style="left:396px;top:458px;width:586px;height:44px;display:flex;align-items:center;gap:10px">
      <div class="btn" id="s1-sum" style="background:linear-gradient(120deg,#7c3aed,#22d3ee);color:#fff;box-shadow:0 8px 24px -8px rgba(124,58,237,.8)">✦ خلاصه با AI</div>
      <div style="flex:1"></div>
      <div class="pill mono" style="background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.35);font-size:12px">● REC <span id="s1-timer">00:12:34</span></div>
      <div style="width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:15px">🎙</div>
      <div style="width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:15px">📷</div>
    </div>
    <div class="abs card" style="left:16px;top:16px;width:362px;height:486px;overflow:hidden">
      <div class="fa" style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.06)">
        <b style="font-size:14px">رونویسی زنده</b><span class="pill mono" style="background:rgba(239,68,68,.15);color:#fca5a5">● LIVE</span>
      </div>
      <div style="padding:16px">${lines}</div>
      <div class="abs" id="s1-thinking" style="left:16px;right:16px;bottom:16px;height:40px;border-radius:10px;background:linear-gradient(90deg,rgba(124,58,237,.15),rgba(34,211,238,.25),rgba(124,58,237,.15));background-size:200% 100%;display:grid;place-items:center;font-size:12.5px" ><span class="fa">✦ AI در حال تحلیل جلسه…</span></div>
      <div class="abs" id="s1-summary" style="left:10px;right:10px;bottom:10px;border-radius:12px;background:#121a30;border:1px solid rgba(167,139,250,.4);padding:14px 16px;box-shadow:0 -20px 40px -10px rgba(0,0,0,.6)">
        <div class="fa" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:14px;color:#c4b5fd">✦ خلاصه و اقدام‌ها</b><span class="pill mono" style="color:#94a3b8;background:rgba(255,255,255,.05)">LLM</span></div>
        ${acts}
      </div>
    </div>`);
}
function update1(L, root) {
  const cur = LINES.reduce((acc, l, i) => (L >= l[2] ? i : acc), -1);
  const speaking = L < 3.1 ? cur : -1;
  SPK.forEach((s, i) => {
    const r = root.querySelector(`#t${i} .ring`);
    const on = i === LINES[speaking]?.[0];
    r.style.opacity = on ? 0.6 + 0.4 * Math.sin(L * 9) : 0;
    root.querySelector(`#t${i}`).style.boxShadow = on ? `0 0 30px -6px ${s.c}` : 'none';
  });
  root.querySelectorAll('.wb').forEach((b, i) => {
    const amp = speaking >= 0 ? 1 : 0.25;
    const v = Math.abs(Math.sin(L * 7.3 + i * 0.83) * Math.sin(L * 3.1 + i * 0.29)) * amp;
    b.style.height = (5 + 36 * v) + 'px';
    b.style.opacity = 0.45 + 0.55 * v;
  });
  LINES.forEach(([s, txt, at], i) => {
    const el = root.querySelector('#l' + i);
    const p = prog(L, at, at + 0.15);
    el.style.opacity = p;
    el.style.transform = `translateY(${(1 - eOut(p)) * 10}px)`;
    const n = Math.round(txt.length * prog(L, at + 0.05, at + 0.6));
    el.querySelector('.tx').textContent = txt.slice(0, n);
  });
  const secs = 12 * 60 + 34 + Math.floor(L * 2);
  root.querySelector('#s1-timer').textContent = `00:${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`;
  const sum = root.querySelector('#s1-sum');
  sum.style.transform = `scale(${L > 3.2 && L < 3.33 ? 0.93 : 1})`;
  const th = root.querySelector('#s1-thinking');
  const thp = prog(L, 3.22, 3.32) * (1 - prog(L, 3.5, 3.6));
  th.style.opacity = thp;
  th.style.backgroundPosition = `${-L * 300}% 0`;
  const sp = eOut5(prog(L, 3.5, 3.95));
  const sm = root.querySelector('#s1-summary');
  sm.style.opacity = sp;
  sm.style.transform = `translateY(${(1 - sp) * 60}px)`;
  root.querySelectorAll('.act').forEach((a, i) => {
    const cp = eBack(prog(L, 3.95 + i * 0.35, 4.15 + i * 0.35));
    const cb = a.querySelector('.cb');
    cb.style.background = cp > 0.01 ? '#4ade80' : 'transparent';
    cb.style.borderColor = cp > 0.01 ? '#4ade80' : '#64748b';
    cb.textContent = cp > 0.01 ? '✓' : '';
    cb.style.transform = `scale(${cp > 0.01 ? cp : 1})`;
    a.style.opacity = 0.35 + 0.65 * prog(L, 3.7 + i * 0.12, 3.9 + i * 0.12);
  });
}

/* ===================== SCENE 2 · AdvertisingPanel kanban ===================== */

const DROP = { x: COLX(3), y: SLOTY(1) };
function update2(L, root, cursorAt) {
  const m = root.querySelector('#kmove');
  const base = { x: COLX(2), y: SLOTY(0) };
  let x = base.x, y = base.y, rot = 0, lift = 0;
  if (L >= 1.0 && L < 1.95) {

    if (i === 5) el.style.background = `rgba(34,211,238,${0.2 * (1 - prog(L, 2.6, 3.6))})`;
  });
  const bk = root.querySelector('#bk2');
  if (L < 1.2) { bk.textContent = 'رزرو'; bk.style.background = 'linear-gradient(120deg,#06b6d4,#6366f1)'; }
  else if (L < 1.7) { bk.textContent = '•••'.slice(0, 1 + Math.floor(L * 8) % 3); }
  else { bk.textContent = '✓ رزرو شد'; bk.style.background = '#16a34a'; }
  bk.style.transform = `scale(${L > 1.2 && L < 1.32 ? 0.9 : 1})`;
  const pin = eBack(prog(L, 1.9, 2.25)), pout = eIO(prog(L, 3.1, 3.4));
  const push = root.querySelector('#push');
  push.style.transform = `translateY(${(1 - pin) * -110 - pout * 110}px)`;
  push.style.opacity = pin > 0 ? 1 - pout : 0;
  const xls = root.querySelector('#s4-xls');
  xls.style.transform = `scale(${L > 3.4 && L < 3.52 ? 0.92 : 1})`;
  root.querySelector('#s4-prog').style.width = (eIO(prog(L, 3.45, 4.25)) * 100) + '%';
  const fp = eBack(prog(L, 4.3, 4.6));
  const file = root.querySelector('#s4-file');
  file.style.opacity = prog(L, 4.3, 4.4);
  file.style.transform = `scale(${0.7 + 0.3 * fp})`;
}

/* ===================== Build ===================== */
const SCENES = [
  { build: scene0, update: update0, cap: ['Workflow Automation', 'n8n · AI Agent · Python · Postgres · Telegram'] },
  { build: scene1, update: update1, cap: ['HamNeshin', 'Real-time transcription · Speaker diarization · AI summary'] },
  { build: scene2, update: update2, cap: ['AdvertisingPanel', '7-role campaign workflow · Approvals · RBAC'] },
  { build: scene3, update: update3, cap: ['Qaf LegalTech', 'Case management · Client portal · Row-level security'] },
  { build: scene4, update: update4, cap: ['Refahi PWA', 'Mobile booking · Web Push · One-click Excel reports'] },
];
const sceneEls = SCENES.map((s, i) => {
  const el = document.createElement('div');
  el.className = 'scene'; el.id = 's' + i;
  el.innerHTML = s.build();
  document.getElementById('scenes').appendChild(el);
  return el;
});
const capEls = SCENES.map((s, i) => {
  const el = document.createElement('div');
  el.className = 'cap';
  el.innerHTML = `<div class="num">0${i + 1} / 0${N}</div><div class="title">${[...s.cap[0]].map(ch => `<span>${ch}</span>`).join('')}</div><div class="sub">${s.cap[1]}</div>`;
  document.getElementById('caps').appendChild(el);
  return el;
});
document.getElementById('dots').innerHTML = SCENES.map(() => '<div><b></b></div>').join('');

/* ===================== Cursor path (resolved against real element positions) ===================== */
function center(sel, sceneIdx) {
  const el = sceneEls[sceneIdx].querySelector(sel);
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}
const C = (x, y) => ({ x: SCENE_X + x, y: CONTENT_Y + y });
let KF = [];
function buildPath() {
  const P = [
    [ [0, C(520, 450)], [0.85, center('#s0-exec', 0), 'click'], [1.85, center('#n2', 0)], [2.55, center('#n4', 0)], [3.3, center('#n6', 0)], [4.0, center('#n7', 0)], [4.75, center('#s0-toast', 0)], [5.5, C(560, 420)] ],
    [ [0, C(600, 300)], [0.6, center('#t0', 1)], [1.35, center('#l1', 1)], [2.3, C(690, 425)], [3.15, center('#s1-sum', 1), 'click'], [3.95, C(190, 400)], [4.7, C(190, 455)], [5.5, C(540, 260)] ],
    [ [0, C(560, 300)], [0.85, { x: SCENE_X + COLX(2) + 90, y: CONTENT_Y + SLOTY(0) + 43 }, 'down'], [1.9, { x: SCENE_X + DROP.x + 90, y: CONTENT_Y + DROP.y + 43 }, 'up'], [2.65, C(DROP.x + 40, DROP.y + 64), 'click'], [3.6, C(330, 200)], [4.4, center('#ktoast', 2)], [5.4, C(600, 250)] ],
    [ [0, C(450, 200)], [0.55, center('#st1', 3)], [1.35, C(560, 170)], [2.0, center('#r0', 3)], [2.45, center('#r1', 3)], [2.95, center('#r2', 3), 'click'], [3.8, C(175, 222)], [4.6, C(175, 470)], [5.5, C(620, 320)] ],
    [ [0, C(500, 260)], [0.6, C(180, 150)], [1.15, center('#bk2', 4), 'click'], [2.2, C(180, 40)], [2.9, center('#rr5', 4)], [3.35, center('#s4-xls', 4), 'click'], [4.4, center('#s4-file', 4)], [5.4, C(560, 300)] ],
  ];
  const list = [];
  P.forEach((pts, si) => pts.forEach(([t, pos, act]) => list.push({ t: si * D + t, x: pos.x, y: pos.y, act })));
  KF = [...list.map(k => ({ ...k, t: k.t - TOTAL })), ...list, ...list.map(k => ({ ...k, t: k.t + TOTAL }))].sort((a, b) => a.t - b.t);
}
function cursorPos(t) {
  let i = KF.findIndex(k => k.t > t);
  const a = KF[i - 1], b = KF[i];
  const span = b.t - a.t;
  const mv = Math.min(0.5, span * 0.85);
  const start = b.t - mv;
  if (t <= start) {
    // small idle drift while dwelling
    return { x: a.x + Math.sin(t * 2.1) * 3, y: a.y + Math.cos(t * 1.7) * 3 };
  }
  const u = eIO((t - start) / mv);
  const dx = b.x - a.x, dy = b.y - a.y;
  const arc = Math.sin(u * Math.PI) * 0.18;
  return { x: a.x + dx * u - dy * arc, y: a.y + dy * u + dx * arc };
}
function isDown(t) {
  // mouse held between a 'down' keyframe and the next 'up' keyframe
  const tm = ((t % TOTAL) + TOTAL) % TOTAL;
  return tm >= 2 * D + 0.95 && tm < 2 * D + 1.95;
}

/* ===================== Transitions (every hand-off uses a different move) ===================== */
const TRANS = ['swing', 'zoom', 'circle', 'wipe', 'drop'];
function applyTransition(el, kind, p, dir, origin) {
  // dir: 'out' | 'in' ; p eased 0..1 progress of the transition
  let tf = '', op = 1, filter = 'none', clip = 'none';
  const q = 1 - p;
  switch (kind) {
    case 'swing':
      if (dir === 'out') { tf = `perspective(1600px) translateX(${-p * 75}%) rotateY(${p * 55}deg) scale(${1 - 0.15 * p})`; op = 1 - p * 0.95; }
      else { tf = `perspective(1600px) translateX(${q * 75}%) rotateY(${-q * 55}deg) scale(${0.85 + 0.15 * p})`; op = Math.min(1, p * 1.6); }
      break;
    case 'zoom':
      if (dir === 'out') { tf = `scale(${1 + 1.5 * p})`; op = 1 - p; filter = `blur(${14 * p}px)`; }
      else { tf = `scale(${0.5 + 0.5 * eBack(p)})`; op = Math.min(1, p * 1.4); filter = `blur(${8 * q}px)`; }
      break;
    case 'circle':
      if (dir === 'out') { tf = `scale(${1 - 0.08 * p})`; filter = `brightness(${1 - 0.6 * p})`; }
      else { clip = `circle(${p * 125}% at ${origin.x}px ${origin.y}px)`; tf = `scale(${1.06 - 0.06 * p})`; }
      break;
    case 'wipe': {
      if (dir === 'out') { tf = `translateY(${-p * 14}%) rotate(${-p * 5}deg) scale(${1 - 0.1 * p})`; op = 1 - p; }
      else { const e = -45 + p * 190; clip = `polygon(0 0, ${e}% 0, ${e - 45}% 100%, 0 100%)`; tf = `translateX(${-q * 6}%)`; }
      break;
    }
    case 'drop':
      if (dir === 'out') { tf = `translateY(${-p * 120}%) rotate(${-p * 8}deg) scale(${1 - 0.18 * p})`; }
      else { tf = `translateY(${(1 - eBack(p)) * 115}%) rotate(${q * 6}deg)`; }
      break;
  }
  el.style.transform = tf; el.style.opacity = op; el.style.filter = filter; el.style.clipPath = clip;
}

/* ===================== Caption entrances (also unique per project) ===================== */
function updateCaption(i, L) {
  const el = capEls[i];
  const inP = prog(L, 0.1, 0.9), outP = prog(L, D - 0.75, D - 0.35);
  const vis = L > -0.1 && L < D;
  el.style.display = vis ? 'block' : 'none';
  if (!vis) return;
  const spans = el.querySelectorAll('.title span');
  const num = el.querySelector('.num'), sub = el.querySelector('.sub'), title = el.querySelector('.title');
  title.style.letterSpacing = '-0.02em'; title.style.filter = 'none'; title.style.transform = 'none'; title.style.clipPath = 'none';
  spans.forEach(s => { s.style.transform = 'none'; s.style.opacity = 1; });
  switch (i) {
    case 0: spans.forEach((s, k) => { const p = eOut(prog(L, 0.1 + k * 0.025, 0.6 + k * 0.025)); s.style.transform = `translateY(${(1 - p) * 36}px) rotate(${(1 - p) * 12}deg)`; s.style.opacity = p; }); break;
    case 1: title.style.letterSpacing = `${lerp(0.6, -0.02, eOut(inP))}em`; title.style.filter = `blur(${(1 - eOut(inP)) * 10}px)`; title.style.opacity = inP; break;
    case 2: title.style.clipPath = `inset(0 ${100 - eOut5(inP) * 100}% 0 0)`; title.style.transform = `translateX(${(1 - eOut5(inP)) * -30}px)`; break;
    case 3: title.style.transform = `scale(${lerp(1.5, 1, eOut5(inP))})`; title.style.transformOrigin = 'left center'; title.style.opacity = inP; break;
    case 4: { const n = Math.floor(spans.length * prog(L, 0.15, 0.8)); spans.forEach((s, k) => s.style.opacity = k < n ? 1 : 0); break; }
  }
  num.style.opacity = prog(L, 0.05, 0.4);
  sub.style.opacity = prog(L, 0.5, 0.95);
  sub.style.transform = `translateY(${(1 - eOut(prog(L, 0.5, 0.95))) * 8}px)`;
  el.style.opacity = 1 - outP;
  el.style.transform = `translateY(${-outP * 14}px)`;
}

/* ===================== Background + FX canvas ===================== */
const stars = Array.from({ length: 80 }, (_, i) => ({ x: (i * 397) % W, y: (i * 211 + 37) % H, r: 0.4 + (i % 5) * 0.3, m: 1 + (i % 4), ph: i * 1.7 }));
const sctx = document.getElementById('stars').getContext('2d');
const fx = document.getElementById('fx').getContext('2d');
function drawBg(t) {
  const w = TAU * t / TOTAL;
  const pos = [[300, 200, 260, 120, 1, 0], [900, 420, 240, 140, 2, 1.3], [700, 120, 300, 90, 1, 2.6], [200, 560, 200, 80, 3, 4.1]];
  ['b1', 'b2', 'b3', 'b4'].forEach((id, i) => {
    const [cx, cy, rx, ry, n, ph] = pos[i];
    const el = document.getElementById(id);
    const s = el.offsetWidth / 2;
    el.style.transform = `translate(${cx + rx * Math.cos(w * n + ph) - s}px, ${cy + ry * Math.sin(w * n * 1 + ph * 1.3) - s}px) scale(${1 + 0.15 * Math.sin(w * n + ph)})`;
    el.style.opacity = 0.32 + 0.12 * Math.sin(w * (n + 1) + ph);
  });
  const off = (t / TOTAL) * 64 * 4 % 64;
  document.getElementById('grid').style.transform = `translate(${off}px, ${off * 0.5}px)`;
  sctx.clearRect(0, 0, W, H);
  stars.forEach(s => {
    const a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(w * s.m * 3 + s.ph));
    sctx.fillStyle = `rgba(165,243,252,${a})`;
    sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, TAU); sctx.fill();
  });
}
function clicksNear(t) {
  return KF.filter(k => k.act === 'click' || k.act === 'down').filter(k => t - k.t >= 0 && t - k.t < 0.8);
}
function drawOrb(t) {
  fx.clearRect(0, 0, W, H);
  fx.globalCompositeOperation = 'lighter';
  // comet trail: dense glowing beads interpolated so the tube stays smooth at any speed
  const SAMPLES = 40, SPAN = 0.42;
  let prev = cursorPos(t), prevF = 1;
  for (let k = 1; k <= SAMPLES; k++) {
    const p = cursorPos(t - (k / SAMPLES) * SPAN);
    const f = 1 - k / SAMPLES;
    const dist = Math.hypot(p.x - prev.x, p.y - prev.y);
    const steps = Math.max(1, Math.ceil(dist / 2.5));
    for (let j = 0; j < steps; j++) {
      const u = j / steps;
      const ff = prevF + (f - prevF) * u;
      const x = prev.x + (p.x - prev.x) * u, y = prev.y + (p.y - prev.y) * u;
      const hue = 188 + (1 - ff) * 95;
      fx.fillStyle = `hsla(${hue}, 95%, 66%, ${0.07 * ff * ff + 0.01})`;
      fx.beginPath(); fx.arc(x, y, 1.5 + 9 * ff, 0, TAU); fx.fill();
    }
    prev = p; prevF = f;
  }
  // click ripples + sparks
  clicksNear(t).forEach(k => {
    const a = (t - k.t) / 0.8;
    for (let r = 0; r < 2; r++) {
      const aa = clamp(a - r * 0.15, 0, 1);
      if (aa <= 0) continue;
      fx.strokeStyle = `rgba(103,232,249,${(1 - aa) * 0.9})`;
      fx.lineWidth = 2.5 * (1 - aa) + 0.5;
      fx.beginPath(); fx.arc(k.x, k.y, 10 + eOut(aa) * 60, 0, TAU); fx.stroke();
    }
    for (let s = 0; s < 10; s++) {
      const ang = s / 10 * TAU + k.t;
      const d = 12 + eOut(a) * 48;
      fx.fillStyle = `rgba(216,180,254,${(1 - a) * 0.9})`;
      fx.beginPath(); fx.arc(k.x + Math.cos(ang) * d, k.y + Math.sin(ang) * d, 2.2 * (1 - a) + 0.4, 0, TAU); fx.fill();
    }
  });
  fx.globalCompositeOperation = 'source-over';
  // the orb itself, squashed along its velocity
  const c = cursorPos(t), b = cursorPos(t - 0.016);
  const vx = c.x - b.x, vy = c.y - b.y, sp = Math.min(Math.hypot(vx, vy), 40);
  const press = clicksNear(t).some(k => t - k.t < 0.14) || isDown(t) ? 0.78 : 1;
  const R = 12 * press;
  fx.save();
  fx.translate(c.x, c.y);
  fx.rotate(Math.atan2(vy, vx));
  fx.scale(1 + sp / 60, 1 / (1 + sp / 60));
  const glow = fx.createRadialGradient(0, 0, 0, 0, 0, R * 4);
  glow.addColorStop(0, 'rgba(103,232,249,.55)'); glow.addColorStop(0.4, 'rgba(139,92,246,.22)'); glow.addColorStop(1, 'rgba(139,92,246,0)');
  fx.fillStyle = glow; fx.beginPath(); fx.arc(0, 0, R * 4, 0, TAU); fx.fill();
  const g = fx.createRadialGradient(-R * 0.35, -R * 0.4, R * 0.1, 0, 0, R);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, '#a5f3fc'); g.addColorStop(0.75, '#22d3ee'); g.addColorStop(1, '#7c3aed');
  fx.fillStyle = g; fx.beginPath(); fx.arc(0, 0, R, 0, TAU); fx.fill();
  fx.restore();
  if (isDown(t)) {
    fx.strokeStyle = 'rgba(244,114,182,.8)'; fx.lineWidth = 2;
    fx.beginPath(); fx.arc(c.x, c.y, 22 + 2 * Math.sin(t * 20), 0, TAU); fx.stroke();
  }
}

/* ===================== Frame ===================== */
function render(t) {
  t = ((t % TOTAL) + TOTAL) % TOTAL;
  drawBg(t);
  const cursorAtScene = i => L => cursorPos(i * D + L);
  sceneEls.forEach((el, i) => {
    let L = t - i * D;
    if (i === 0 && t > TOTAL - TD) L = t - TOTAL;   // first project enters again at the loop seam
    const visible = L > -TD && L < D;
    el.style.display = visible ? 'block' : 'none';
    if (!visible) return;
    SCENES[i].update(clamp(L, 0, D), el, cursorAtScene(i));
    el.style.zIndex = 1;
    if (L < 0) {
      const k = (i - 1 + N) % N;
      const p = eIO((L + TD) / TD);
      const c = cursorPos(i * D - TD + (i === 0 ? TOTAL : 0));
      applyTransition(el, TRANS[k], p, 'in', { x: c.x - SCENE_X, y: c.y - SCENE_Y });
      el.style.zIndex = TRANS[k] === 'zoom' ? 1 : 2;
    } else if (L > D - TD) {
      const p = eIO((L - (D - TD)) / TD);
      applyTransition(el, TRANS[i], p, 'out');
      el.style.zIndex = TRANS[i] === 'zoom' ? 2 : 1;
    } else {
      el.style.transform = 'none'; el.style.opacity = 1; el.style.filter = 'none'; el.style.clipPath = 'none';
    }
  });
  capEls.forEach((el, i) => {
    let L = t - i * D;
    if (i === 0 && t > TOTAL - TD) L = t - TOTAL;
    updateCaption(i, L);
  });
  document.querySelectorAll('#dots b').forEach((b, i) => {
    const L = t - i * D;
    b.style.width = (L < 0 ? 0 : L > D ? 100 : (L / D) * 100) + '%';
    b.parentElement.style.width = (L >= 0 && L < D ? 40 : 22) + 'px';
  });
  drawOrb(t);
}

window.ready = (async () => {
  await document.fonts.ready;
  buildPath();
  render(0);
  return true;
})();
window.render = render;
window.TOTAL = TOTAL;
</script>
</body>
